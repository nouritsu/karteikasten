# Closed classes, hand-checked against Wiktionary and merged in stage 40; they win
# over what the build extracts (provenance `manual`).
#
# [preposition] "id" = { cases = [...] }: the cases governed, the main one first
#   (nom, acc, dat, gen); acc and dat together make a two-way preposition.
#   Optional `contractions = [...]` replaces the contractions found in Wiktionary.
# [conjunction] "id" = "coordinating" | "subordinating"
#
# Drafted by `python -m karteikasten_pipeline.draft` from both editions: the comment
# above each entry is what they say. CHECK marks entries where they disagree.
# "Checked 2026-10-22" notes your decision where the editions disagreed, said
# nothing, or gave acc and dat to a preposition that is not two-way.

[preposition]

# in (rank 7). Only the German edition says. en categories: nothing; de tags: dat, acc.
"in#prep#1" = { cases = ["dat", "acc"] }

# mit (rank 14). en categories: dat; de tags: dat.
"mit#prep#1" = { cases = ["dat"] }

# zu (rank 18). en categories: dat; de tags: dat.
"zu#prep#1" = { cases = ["dat"] }

# von (rank 19). en categories: dat; de tags: dat.
"von#prep#1" = { cases = ["dat"] }

# auf (rank 20). Only the German edition says. en categories: nothing; de tags: dat, acc.
"auf#prep#1" = { cases = ["dat", "acc"] }

# für (rank 22). en categories: acc; de tags: acc.
"für#prep#1" = { cases = ["acc"] }

# an (rank 24). en categories: acc, dat; de tags: acc, dat.
#   de note: mit dem Akkusativ (zur Anzeige der Richtung)
#   de note: mit dem Dativ (zur Anzeige der Lage)
#   de note: mit dem Dativ
#   de note: Objekt-Präposition (mit bestimmten Verben); mit dem Akkusativ
"an#prep#1" = { cases = ["acc", "dat"] }

# bei (rank 47). en categories: dat; de tags: dat.
"bei#prep#1" = { cases = ["dat"] }

# nach (rank 52). en categories: dat; de tags: dat.
"nach#prep#1" = { cases = ["dat"] }

# aus (rank 53). en categories: dat; de tags: dat.
"aus#prep#1" = { cases = ["dat"] }

# um (rank 63). Only the English edition says. en categories: acc; de tags: nothing.
"um#prep#1" = { cases = ["acc"] }

# vor (rank 75). en categories: acc, dat; de tags: dat.
#   de note: im Dativ steht das später stattfindende Objekt oder eine Zeitspanne in Bezug auf die Gegenwart
#   de note: das mit dem Dativ bezeichnete Objekt befindet sich weiter hinten
#   Checked 2026-10-22: two-way. de sense 3 is "mit Akkusativ: in räumlicher Richtung"
#   („Stell die Schuhe vor die Tür.“).
"vor#prep#1" = { cases = ["dat", "acc"] }

# über (rank 76). en categories: acc; de tags: dat, acc.
#   de note: Wechselpräposition mit dem Dativ
#   de note: Wechselpräposition mit dem Akkusativ
#   Checked 2026-10-22: two-way. en sense 1 is "[with accusative or dative] above, over".
"über#prep#1" = { cases = ["dat", "acc"] }

# bis (rank 91). Only the English edition says. en categories: acc; de tags: nothing.
"bis#prep#1" = { cases = ["acc"] }

# durch (rank 104). en categories: acc; de tags: acc.
"durch#prep#1" = { cases = ["acc"] }

# unter (rank 139). en categories: acc, dat; de tags: dat, acc.
"unter#prep#1" = { cases = ["dat", "acc"] }

# seit (rank 140). Only the English edition says. en categories: dat; de tags: nothing.
"seit#prep#1" = { cases = ["dat"] }

# gegen (rank 153). Only the English edition says. en categories: acc; de tags: nothing.
"gegen#prep#1" = { cases = ["acc"] }

# ohne (rank 163). en categories: acc; de tags: acc.
"ohne#prep#1" = { cases = ["acc"] }

# ab (rank 180). en categories: dat; de tags: dat, acc.
#   Checked 2026-10-22: dative. de gives the accusative only with times and quantities
#   („Ab drittem (auch: dritten) Oktober“); with it the card would say two-way.
"ab#prep#1" = { cases = ["dat"] }

# wegen (rank 195). en categories: dat, gen; de tags: gen, dat.
#   de note: Präposition mit Genitiv, mit Dativ
"wegen#prep#1" = { cases = ["gen", "dat"] }

# zwischen (rank 258). en categories: acc, dat; de tags: dat, acc.
"zwischen#prep#1" = { cases = ["dat", "acc"] }

# hinter (rank 317). en categories: acc, dat; de tags: dat, acc.
"hinter#prep#1" = { cases = ["dat", "acc"] }

# laut (rank 401). en categories: dat, gen; de tags: gen, dat.
"laut#prep#2" = { cases = ["gen", "dat"] }

# dank (rank 457). en categories: dat, gen; de tags: gen, dat.
"dank#prep#1" = { cases = ["gen", "dat"] }

# neben (rank 523). en categories: acc, dat; de tags: dat.
#   Checked 2026-10-22: two-way. de sense 1 has „(direktional:) Klaus hat sich einfach neben
#   mich gesetzt.“; en has „Das Sofa gehört neben den Tisch.“
"neben#prep#1" = { cases = ["dat", "acc"] }

# außer (rank 544). en categories: dat, gen; de tags: gen, dat.
#   de note: bei „Land“ mit Genitiv
"außer#prep#1" = { cases = ["gen", "dat"] }

# lang (rank 640). en categories: nothing; de tags: nothing.
#   Checked 2026-10-22: accusative. Neither edition names lang's case; en sense 2 is
#   "alternative form of entlang", and en files the postposition entlang under
#   "German postpositions governing the accusative" („Ich gehe den Fluss entlang.“).
"lang#postp#1" = { cases = ["acc"] }

# während (rank 671). en categories: dat, gen; de tags: gen, dat.
#   de note: umgangssprachlich und in älterer Sprache auch mit dem Dativ
"während#prep#1" = { cases = ["gen", "dat"] }

# pro (rank 712). en categories: acc, dat, nom; de tags: acc, dat.
#   Checked 2026-10-22: accusative, listed first by both; acc or dat is not two-way.
"pro#prep#1" = { cases = ["acc"] }

# gegenüber (rank 743). en categories: dat; de tags: dat.
#   de note: (lokale) Präposition mit dem Dativ
#   de note: (modale) Präposition mit dem Dativ
"gegenüber#prep#1" = { cases = ["dat"] }

# statt (rank 938). en categories: dat, gen; de tags: gen, dat.
#   de note: bei Pronomen, wo der Genitiv antiquiert wirkt, auch mit Dativ, ansonsten ist der Dativ umgangssprachlich
"statt#prep#1" = { cases = ["gen", "dat"] }

# innerhalb (rank 1054). en categories: gen; de tags: gen.
#   de note: mit Genitiv
"innerhalb#prep#1" = { cases = ["gen"] }

# trotz (rank 1058). en categories: dat, gen; de tags: gen; de, as colloquial/regional/old: dat.
#   de note: seltener, in der Schweiz, in Süddeutschland und Österreich häufiger mit dem Dativ
"trotz#prep#1" = { cases = ["gen", "dat"] }

# nach (rank 1133). en categories: dat; de tags: dat.
"nach#postp#1" = { cases = ["dat"] }

# per (rank 1208). Only the English edition says. en categories: acc, dat; de tags: nothing.
#   Checked 2026-10-22: accusative, listed first; acc or dat is not two-way.
"per#prep#1" = { cases = ["acc"] }

# aufgrund (rank 1217). en categories: gen; de tags: gen.
"aufgrund#prep#1" = { cases = ["gen"] }

# außerhalb (rank 1282). en categories: gen; de tags: gen.
#   de note: als lokale (örtliche) Präposition mit Genitiv
#   de note: als temporale (zeitliche) Präposition mit Genitiv
"außerhalb#prep#1" = { cases = ["gen"] }

# entlang (rank 1378). Only the English edition says. en categories: acc; de tags: nothing.
"entlang#prep#1" = { cases = ["acc"] }

# namens (rank 1578). en categories: gen; de tags: gen.
#   de note: amtssprachlich; mit Genitiv
"namens#prep#1" = { cases = ["gen"] }

# b. (rank 1851). Only the English edition says. en categories: dat; de tags: nothing.
"b.#prep#1" = { cases = ["dat"] }

# voller (rank 1920). en categories: dat, gen; de tags: dat, gen.
#   de note: Bezugswort undekliniert, Genitiv nur am Adjektivattribut erkennbar
"voller#prep#1" = { cases = ["dat", "gen"] }

[conjunction]

# und (rank 5). en categories: coordinating; de: coordinating.
"und#conj#1" = "coordinating"

# dass (rank 25). en categories: subordinating; de: subordinating.
"dass#conj#1" = "subordinating"

# wie (rank 34). Only the German edition says. en categories: nothing; de: coordinating, subordinating.
"wie#conj#1" = "coordinating"

# wenn (rank 37). en categories: subordinating; de: subordinating.
"wenn#conj#1" = "subordinating"

# als (rank 38). en categories: subordinating; de: coordinating.
#   Checked 2026-10-22: subordinating. de's temporal sense joins "Haupt- und Nebensatz"
#   („Als er nach Hause kam, war seine Frau bereits fort.“).
"als#conj#1" = "subordinating"

# oder (rank 49). Only the English edition says. en categories: coordinating; de: nothing.
"oder#conj#1" = "coordinating"

# da (rank 71). Only the German edition says. en categories: nothing; de: subordinating.
"da#conj#1" = "subordinating"

# aber (rank 87). en categories: coordinating; de: coordinating.
"aber#conj#1" = "coordinating"

# doch (rank 90). en categories: nothing; de: nothing.
#   Checked 2026-10-22: coordinating. en tags the sense "coordinating"; de has it as
#   "Adversative Konjunktion" („Ich lud ihn ein, doch er wollte nicht kommen.“).
"doch#conj#1" = "coordinating"

# um (rank 101). Only the German edition says. en categories: nothing; de: subordinating.
"um#conj#1" = "subordinating"

# denn (rank 102). Only the German edition says. en categories: nothing; de: coordinating.
"denn#conj#1" = "coordinating"

# weil (rank 116). en categories: coordinating, subordinating; de: subordinating.
#   Checked 2026-10-22: subordinating. de tags weil with a main clause colloquial
#   („weil die Autobahn war gesperrt“).
"weil#conj#1" = "subordinating"

# ob (rank 142). en categories: subordinating; de: subordinating.
"ob#conj#1" = "subordinating"

# sondern (rank 315). en categories: coordinating; de: coordinating.
"sondern#conj#1" = "coordinating"

# bevor (rank 321). Only the German edition says. en categories: nothing; de: subordinating.
"bevor#conj#1" = "subordinating"

# während (rank 385). Only the German edition says. en categories: nothing; de: subordinating.
"während#conj#1" = "subordinating"

# nachdem (rank 497). Only the German edition says. en categories: nothing; de: subordinating.
"nachdem#conj#1" = "subordinating"

# falls (rank 506). Only the German edition says. en categories: nothing; de: subordinating.
"falls#conj#1" = "subordinating"

# obwohl (rank 654). Only the German edition says. en categories: nothing; de: subordinating.
"obwohl#conj#1" = "subordinating"

# sobald (rank 682). en categories: subordinating; de: subordinating.
"sobald#conj#1" = "subordinating"

# ohne (rank 789). Only the German edition says. en categories: nothing; de: subordinating.
"ohne#conj#1" = "subordinating"

# damit (rank 849). en categories: subordinating; de: subordinating.
"damit#conj#1" = "subordinating"

# indem (rank 860). Only the German edition says. en categories: nothing; de: subordinating.
"indem#conj#1" = "subordinating"

# bis (rank 889). en categories: subordinating; de: subordinating.
"bis#conj#1" = "subordinating"

# weder (rank 913). Only the German edition says. en categories: nothing; de: coordinating.
"weder#conj#1" = "coordinating"

# soweit (rank 933). Only the German edition says. en categories: nothing; de: subordinating.
"soweit#conj#1" = "subordinating"

# solange (rank 966). Only the German edition says. en categories: nothing; de: subordinating.
"solange#conj#1" = "subordinating"

# entweder (rank 1000). Only the German edition says. en categories: nothing; de: coordinating.
"entweder#conj#1" = "coordinating"

# sowie (rank 1134). en categories: coordinating; de: subordinating.
#   Checked 2026-10-22: coordinating. de sense 1 is „wie auch, und außerdem“ („Zelte,
#   Schlafsäcke sowie Proviant“); "as soon as" is tagged colloquial.
"sowie#conj#1" = "coordinating"

# desto (rank 1554). Only the German edition says. en categories: nothing; de: coordinating.
"desto#conj#1" = "coordinating"

# ehe (rank 1659). en categories: subordinating; de: subordinating.
"ehe#conj#1" = "subordinating"
