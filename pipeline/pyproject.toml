[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "karteikasten-pipeline"
version = "0.1.0"
description = "Builds the Karteikasten deck bundle from openly licensed sources"
requires-python = ">=3.12"
# Provided by Nix (nix/pipeline.nix); never installed with pip.
dependencies = ["duckdb", "httpx"]

[project.scripts]
karteikasten-pipeline = "karteikasten_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["karteikasten_pipeline*"]

[tool.setuptools.package-data]
karteikasten_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
