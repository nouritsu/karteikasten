name: Release

# Push a tag that matches the version in app/package.json, e.g. v0.1.0. The APK bundles
# the public deck nix/deck.json pins (D68; nix run .#deck-release uploads one).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release
  id-token: write # sign the attestation
  attestations: write # store the attestation

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release notes read every earlier tag and commit
          persist-credentials: false

      - name: Check the tag against app/package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version app/package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=Tag and version differ::Tag $TAG, but app/package.json says $version. Bump the version, commit, and tag again."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag is not on main::$GITHUB_SHA is not in main's history. Merge it into main, then tag the merged commit."
            exit 1
          fi

      # A release without a deck would ship the empty stub.
      - name: Check a deck is pinned
        run: |
          if [ "$(jq -r '.url // empty' nix/deck.json)" = "" ]; then
            echo "::error title=No deck pinned::nix/deck.json pins no deck. Build one with nix run .#build -- --profile public, upload it with nix run .#deck-release, and commit the pin."
            exit 1
          fi

      # Before the Nix steps, so a missing secret fails in seconds, not after the cache restore.
      # Nothing is written to disk here; the keystore is decoded right before it is used.
      - name: Check the release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FDROID_DISPATCH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD FDROID_DISPATCH_TOKEN; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Release secrets missing::Add these repository secrets: ${missing[*]}"
            exit 1
          fi
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /dev/null; then
            echo "::error title=Bad keystore secret::ANDROID_KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-outputs = true

      # Same cache as ci.yml, restore only: a tag's cache is invisible to everything but
      # that tag, so it would only take room, and ci.yml saves it from main.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'app/package-lock.json', 'curate/Cargo.lock', 'pipeline/pyproject.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      # The checks CI runs, so a commit whose tests fail is never released.
      - name: Check the flake
        run: nix flake check --no-pure-eval -L

      # The keystore is on disk only from here to the removal step below.
      - name: Write the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # The passwords stay in the environment: apksigner reads them from there.
      - name: Build and sign the APK
        env:
          KARTEIKASTEN_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KARTEIKASTEN_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix run -L .#apk -- --keystore "$RUNNER_TEMP/release.keystore" --alias "$KEY_ALIAS"
          test -f "out/apk/karteikasten-$VERSION.apk"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Write SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd out/apk
          sha256sum "karteikasten-$VERSION.apk" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/apk/karteikasten-${{ steps.version.outputs.version }}.apk

      # Commit subjects since the previous version tag, or all of them for the first tag.
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prev=$(git tag --list 'v*.*.*' --sort=-v:refname | awk -v tag="$TAG" 'found && !seen { print; seen = 1 } $0 == tag { found = 1 }')
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          deck=$(jq -r .version nix/deck.json)
          {
            if [ -n "$prev" ]; then
              git log --format='- %s' "$prev..$TAG"
              printf '\n[Full changelog](%s/compare/%s...%s)\n' "$repo_url" "$prev" "$TAG"
            else
              git log --format='- %s' "$TAG"
              printf '\n[All commits](%s/commits/%s)\n' "$repo_url" "$TAG"
            fi
            printf '\nThe deck: %s ([its release](%s/releases/tag/deck-%s)).\n' "$deck" "$repo_url" "$deck"
            # shellcheck disable=SC2016 # the backticks are markdown, not command substitution
            printf '\nVerify the download with `sha256sum -c SHA256SUMS`, or with `gh attestation verify karteikasten-%s.apk --repo %s`.\n' "$VERSION" "$GITHUB_REPOSITORY"
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" --verify-tag --latest --title "Karteikasten $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "out/apk/karteikasten-$VERSION.apk" out/apk/SHA256SUMS

  # The shared F-Droid repo (nouritsu/fdroid) rebuilds from every app's newest releases.
  # A release made with GITHUB_TOKEN starts no workflows, so this asks it directly, with
  # a fine-grained token that may only send it this event (Contents: write on that repo).
  fdroid:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ask the F-Droid repo to rebuild
        env:
          GH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh api repos/nouritsu/fdroid/dispatches -f event_type=release \
            -f 'client_payload[app]=karteikasten' -f "client_payload[version]=$VERSION"
