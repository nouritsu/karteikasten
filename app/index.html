<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e2e" />
    <script>
      // The theme, the colours, the text's size and motion before the first paint: the saved
      // choices, else Mocha, the default colours, the normal size and the browser's motion
      // (src/lib/theme.ts, src/lib/colors.ts, src/lib/display.ts). The theme's background
      // colours the status bar.
      {
        const read = (key) => {
          try {
            return localStorage.getItem(key)
          } catch {}
        }
        const dark = matchMedia('(prefers-color-scheme: dark)').matches
        const saved = read('theme')
        const theme = saved === 'latte' || (saved === 'system' && !dark) ? 'latte' : 'mocha'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'mocha' ? '#1e1e2e' : '#eff1f5'

        const names = 'rosewater flamingo pink mauve red maroon peach yellow green teal sky sapphire blue lavender'.split(' ')
        let colors
        try {
          colors = JSON.parse(read('colors'))
        } catch {}
        const picked = ['accent', 'der', 'die', 'das', 'plural']
          .filter((key) => names.includes(colors?.[key]))
          .map((key) => `--${key}:var(--ctp-${colors[key]})`)
        if (picked.length) {
          const style = document.createElement('style')
          style.id = 'colors'
          style.textContent = `:root,[data-theme]{${picked.join(';')}}`
          document.head.append(style)
        }

        let display
        try {
          display = JSON.parse(read('display'))
        } catch {}
        const scale = Number(display?.scale)
        if (scale > 0) document.documentElement.style.fontSize = `${16 * scale}px`
        const still = typeof display?.still === 'boolean' ? display.still : matchMedia('(prefers-reduced-motion: reduce)').matches
        if (still) document.documentElement.dataset.still = ''
      }
    </script>
    <title>Karteikasten</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
