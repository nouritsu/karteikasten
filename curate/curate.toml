# Commands the curation tool runs (`nix run .#curate` puts ffmpeg, ffplay and the
# pipeline on PATH). Each is split on spaces; {out} and {file} are filled in after
# the split, so a path with spaces stays one argument. No shell is involved.

# Capture until r is pressed again (the tool sends SIGINT, so ffmpeg closes the file
# properly). PipeWire serves PulseAudio clients; `pactl list short sources` lists
# other inputs to put in place of `default`.
record_cmd = "ffmpeg -nostdin -hide_banner -loglevel error -f pulse -i default -ac 1 -ar 48000 -y {out}"

play_cmd = "ffplay -nodisp -autoexit -loglevel quiet {file}"

# Adds a Commons recording to the snapshot (data/raw, sources.lock.json) so the
# candidates the build did not pick can be heard.
fetch_cmd = "karteikasten-pipeline fetch --commons {file}"
